name: Deploy to GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7

      - name: Version ermitteln
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=$SHORT_SHA" >> "$GITHUB_OUTPUT"

      - name: Dist-Ordner vorbereiten
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true

      - name: Version.js ersetzen
        run: |
          cp .github/build/Version.js dist/js/Version.js
          sed -i \
            -e "s/BUILD_VERSION/${{ steps.version.outputs.version }}/g" \
            dist/js/Version.js

      - name: Supabase.js ersetzen
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          cp .github/build/Supabase.js dist/js/Supabase.js
          sed -i \
            -e "s|SUPABASE_URL|$SUPABASE_URL|g" \
            -e "s|SUPABASE_KEY|$SUPABASE_KEY|g" \
            dist/js/Supabase.js

      - name: JavaScript obfuszieren
        run: |
          npx javascript-obfuscator ./dist --output ./dist \
            --options-preset medium-obfuscation \
            --transform-object-keys false \
            --rename-globals false

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
