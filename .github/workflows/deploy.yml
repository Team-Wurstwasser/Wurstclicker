name: Obfuscate & Deploy to GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7

      - name: Supabase.js aus Secrets generieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p js
          cat << EOF > js/Supabase.js
          const supabaseClient = supabase.createClient(
            "$SUPABASE_URL",
            "$SUPABASE_KEY"
          );
          EOF

      - name: JavaScript obfuszieren
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          npx javascript-obfuscator ./dist --output ./dist \
            --compact true \
            --self-defending true \
            --string-array true

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4