name: Deploy to GitHub Pages

on:
  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7

      - name: Version ermitteln
        id: version
        run: |
          SHORT_SHA=$(echo "${{ github.github_sha || github.sha }}" | cut -c1-7)
          VERSION="v${{ github.run_number }}-$SHORT_SHA"
          echo "Ermittelte Version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Supabase.js aus Secrets generieren
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          mkdir -p js
          cat << EOF > js/Supabase.js
          const supabaseClient = supabase.createClient(
            "$SUPABASE_URL",
            "$SUPABASE_KEY"
          );
          EOF

      - name: Version.js generieren
        run: |
          cat << EOF > js/Version.js
          (function(App) {
              'use strict';
              App.VERSION = '${{ steps.version.outputs.version }}';
          })(window.GameApp = window.GameApp || {});
          EOF

      - name: Dist-Ordner vorbereiten
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true

      - name: Main.js für Produktion ersetzen
        run: |
          cp .github/build/Main.js dist/js/Main.js
          sed -i "s/BUILD_VERSION/${{ steps.version.outputs.version }}/g" dist/js/Main.js

      - name: JavaScript obfuszieren
        run: |
          npx javascript-obfuscator ./dist --output ./dist \
            --compact true \
            --control-flow-flattening true \
            --control-flow-flattening-threshold 0.75 \
            --dead-code-injection true \
            --dead-code-injection-threshold 0.4 \
            --string-array true \
            --string-array-encoding 'base64' \
            --string-array-threshold 0.8 \
            --split-strings true \
            --rename-globals false

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4