name: Obfuscate & Deploy to GitHub Pages

on:
  push:
    branches:
      - main # Passe den Branch an, falls deiner z.B. 'master' heißt

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # 1. Job: Code bauen & obfuszieren
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript obfuszieren
        run: |
          mkdir -p dist
          cp -r * dist/ 2>/dev/null || true
          npx javascript-obfuscator ./dist --output ./dist \
            --compact true \
            --self-defending true \
            --string-array true

      - name: GitHub Pages Artefakt hochladen
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  # 2. Job: Auf GitHub Pages deployen
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build # Wartet, bis der Build-Job fertig ist
    steps:
      - name: Auf GitHub Pages veröffentlichen
        id: deployment
        uses: actions/deploy-pages@v4
